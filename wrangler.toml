#:schema node_modules/wrangler/config-schema.json

name = "muslim-daily-tools"
# The API token can see more than one account; pin the one that owns this Worker
account_id = "d0d4093e165b172528b24f10b4fa6e25"
main = "@tanstack/react-start/server-entry"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

[[routes]]
pattern = "muslimdailytools.com"
custom_domain = true

[[routes]]
pattern = "www.muslimdailytools.com"
custom_domain = true

# Preview environment for PR deployments
[env.preview]
name = "muslim-daily-tools-preview"
workers_dev = true

[[env.preview.routes]]
pattern = "preview.muslimdailytools.com"
custom_domain = true
